<script>
(function () {
  try {
    var t = localStorage.getItem("gp-theme");
    if (t && t.charAt(0) === '"') t = JSON.parse(t);
    if (t === "dark") {
      document.documentElement.dataset.theme = "dark";
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", "#12121C");
    }
  } catch (e) {}
})();
</script>

<!--
THESIS: The organiser's dashboard is the event's gig poster with the box office stapled under it: art and title on top, then the registrations sheet, one blue "Generate N passes" plate, and the live "Checked in N / total". Refuses the SaaS admin (sidebar, KPI tiles, data grid).
OWN-WORLD: The same light luma design as the events homepage (assets/css/luma.css): warm paper with fibre grain; fluoro pink and deep blue riso inks with paper dropouts on filled surfaces; pink-tint rows with 12px corners; Oswald condensed print voice, Barlow Semi Condensed for reading; dotted pink rules; scalloped edge at the foot.
STORY: Sign in with Google, make the event, drop in the sheet, generate passes, send links yourself, hand staff the gate code, watch the counter climb. Fests group sub-events with public registration links under one dashboard.
FIRST VIEWPORT: (event) The shared GatePass header; square riso poster with the title in fluoro pink and the club in blue; registrations row; blue Generate plate; Checked-in card with the pink bar.
FORM: Pinned by the user: concept A "gig poster" (ui-concepts/gatepass/gatepass_a_gigposter.png). No seed roll: user-pinned.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->

<script>
(function () {
  var el = document.getElementById("l-clock");
  if (!el) return;
  var tick = function () { el.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); };
  tick();
  setInterval(tick, 20000);
})();
// Boot watchdog: if the app module never gets to replace the first skeleton
// (CDN or network stall), say so instead of leaving a blank panel forever.
setTimeout(function () {
  var sk = document.getElementById("boot-skeleton");
  if (!sk) return;
  sk.outerHTML = '<section class="empty" role="alert"><h3>Still loading</h3><p class="sub">GatePass is taking a long time to start. Check your connection, then reload.</p><p style="margin-top:14px"><button class="btn small" type="button" id="boot-reload">Reload</button></p></section>';
  // The CSP blocks inline handlers, so wire the Reload button from here.
  var b = document.getElementById("boot-reload");
  if (b) b.addEventListener("click", function () { location.reload(); });
}, 10000);
</script>
