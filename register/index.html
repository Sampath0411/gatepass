<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Register · GatePass</title>
<meta name="description" content="Sign in with Google, register for a GatePass event, and get your entry pass instantly.">
<meta name="theme-color" content="#F6F1EF">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="../assets/img/icon.svg" type="image/svg+xml">
<link rel="preload" href="../assets/fonts/oswald-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/css/gatepass.css">
<link rel="stylesheet" href="../assets/css/luma.css">
<script type="importmap">
{"imports":{
  "firebase/app":"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js",
  "firebase/auth":"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js",
  "firebase/firestore":"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js"
}}
</script>
<script defer src="../firebase-config.js"></script>
<script type="module" src="../assets/js/register.js"></script>
</head>
<body class="luma">
<!--
THESIS: A one-screen door. The event poster, one short form, one blue button — and the pass is in their hands the moment they tap it.
OWN-WORLD: The existing GatePass riso palette only, in the light luma values from assets/css/luma.css (warm paper #F6F1EF, fluoro pink, deep blue #1A43B4, Oswald print voice) — the same design as the events homepage. No new visual language.
STORY: A student opens the link the organiser shared, signs in with Google, types their name, and lands straight on their QR pass.
-->
<header class="l-nav">
  <div class="l-nav-inner">
    <div class="l-nav-left">
      <a class="l-brand" href="../" aria-label="Home"><span class="l-brand-dot"></span><span class="l-brand-name">GatePass</span><span class="l-brand-mini">GP</span><span class="l-brand-sub">Events</span></a>
      <span class="l-nav-sep"></span>
      <nav class="l-links" aria-label="Primary">
        <a class="l-link" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/></svg><span>Events</span></a>
        <a class="l-link" href="../#/calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendars</span></a>
        <a class="l-link" href="../#/discover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg><span>Discover</span></a>
        <a class="l-link" href="../organiser/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 6v12M16 6v12"/></svg><span>Organiser</span></a>
      </nav>
    </div>
    <div class="l-nav-right">
      <button class="l-icon-btn" data-action="clock" title="Local time" aria-label="Local time"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></button>
      <span class="l-clock" id="l-clock"></span>
      <button class="l-icon-btn" data-action="notify" title="Notifications" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9z"/><path d="M10 21h4"/></svg></button>
      <a class="l-create" href="../#/create"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Create Event</span></a>
    </div>
  </div>
</header>
<main class="app">
  <div id="view" aria-live="polite">
    <div class="skeleton" id="boot-skeleton" style="height:420px"></div>
  </div>
</main>
<script>
(function () {
  var el = document.getElementById("l-clock");
  if (!el) return;
  var tick = function () { el.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); };
  tick();
  setInterval(tick, 20000);
})();
// Boot watchdog: if the app module never gets to replace the first skeleton
// (CDN or network stall), say so instead of leaving a blank panel forever.
setTimeout(function () {
  var sk = document.getElementById("boot-skeleton");
  if (!sk) return;
  sk.outerHTML = '<section class="empty" role="alert"><h3>Still loading</h3><p class="sub">Registration is taking a long time to start. Check your connection, then reload.</p><p style="margin-top:14px"><button class="btn small" type="button" onclick="location.reload()">Reload</button></p></section>';
}, 10000);
</script>
</body>
</html>
