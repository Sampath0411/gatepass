<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GatePass · Events</title>
<meta name="description" content="Find something worth showing up for. Discover events, browse the calendar and RSVP with GatePass.">
<meta name="theme-color" content="#F6F1EF">
<link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/gatepass.css">
<link rel="stylesheet" href="assets/css/luma.css">
<script>
(function () {
  try {
    var t = localStorage.getItem("gp-theme");
    if (t && t.charAt(0) === '"') t = JSON.parse(t);
    if (t === "dark") {
      document.documentElement.dataset.theme = "dark";
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", "#12121C");
    }
  } catch (e) {}
})();
</script>
<script type="importmap">
{"imports":{
  "firebase/app":"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js",
  "firebase/auth":"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js",
  "firebase/firestore":"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js"
}}
</script>
<script defer src="firebase-config.js"></script>
<script type="module" src="assets/js/events.js"></script>
</head>
<body class="luma">
<!--
The events homepage is styled in assets/css/luma.css (scoped to body.luma) with
the original GatePass riso-poster look: warm paper grain, deep-blue ink, fluoro
pink rules and scallops, Oswald/Barlow SC, paper cards and blue plates. Every
page wears this same design: the organiser, gate, pass and register pages keep
their gatepass.css markup but load luma.css too, whose body.luma section
remaps the gatepass palette to these light values.
-->
<div id="luma-root"></div>
</body>
</html>
