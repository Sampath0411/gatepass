<body class="luma">
<!--
THESIS: A pass is a printed gig ticket, not a QR in a card. The ticket IS the page: scalloped stock, a riso crowd strip, the name in blue ink, the event in fluoro pink, one big QR and a tear-off stub. Refuses the e-ticket template (logo bar, grey card, small QR, details table).
OWN-WORLD: Warm paper #F3EBEA with fibre grain; two riso inks, fluoro pink #FF2FA2 and deep blue #1A43B4, with paper dropouts on every filled surface; Oswald condensed print voice, Barlow Semi Condensed for anything read at length; scalloped and perforated edges; dotted pink rules. Same light luma design as the events homepage (assets/css/luma.css); the ticket stock is the same paper, printed with the same inks.
STORY: Organiser uploads a sheet and gets a pass per row; attendee opens a link and shows the ticket; a gate phone turns green once and red forever after.
FIRST VIEWPORT: (pass) The shared GatePass header, then the full-width ticket: crowd art strip, name ~48px blue, pink rule, event title ~44px pink uppercase, date and venue, QR ~250px, dotted tear line with side notches, "Show this at the gate".
FORM: Pinned by the user: concept A "gig poster" (ui-concepts/gatepass/gatepass_a_gigposter.png, chosen 11 Nov 2026), comp-led. No seed roll: a user-pinned direction beats the roll.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->

<main class="app">
  <div id="view" aria-live="polite">
    <div class="skeleton" id="boot-skeleton" style="height:min(150vw,720px)" aria-label="Loading your pass"></div>
  </div>
</main>
<script>
(function () {
  var el = document.getElementById("l-clock");
  if (!el) return;
  var tick = function () { el.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); };
  tick();
  setInterval(tick, 20000);
})();
// Boot watchdog: if the pass never replaces the first skeleton (CDN or
// network stall), say so instead of leaving a blank panel forever.
setTimeout(function () {
  var sk = document.getElementById("boot-skeleton");
  if (!sk) return;
  sk.outerHTML = '<section class="torn" role="alert"><h1>Still loading</h1><p class="sub">Your pass is taking a long time to load. Check your connection, then reload.</p><p style="margin-top:14px"><button class="btn small" type="button" onclick="location.reload()">Reload</button></p></section>';
}, 10000);
</script>
</body>
